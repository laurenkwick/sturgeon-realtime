<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>Atlantic Sturgeon Real-Time Tracker</title>
		<script type="text/javascript" src="../../d3.js"></script>
		<script type="text/javascript" src="../../lodash.js"></script>
		<script type="text/javascript" src="../../jquery.js"></script>
		<link rel="stylesheet" type="text/css" href="styles.css" media="screen" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap" rel="stylesheet">	
	</head>
	<body id="the-graphic" class="in-cumulative">
		<div id="tooltip"></div>
		
		<h1>Atlantic Sturgeon Tracker</h1>

		<content>

			<map-content>
				<div id="map-container"></div>
				<div class="the-dateline singular-mode">
					<span class="dateline-label">Sturgeon Movement on </span>
					<div class="dateline-date"> </div>
				</div>
				<div class="the-dateline cumulative-mode">
					<span class="dateline-label">Sturgeon Movement</span>
					<div class="dateline-date"> </div>
				</div>
			</map-content>

			<card-content>
				<h2>Sturgeon Selection</h2>
				<p>Select from the list of sturgeon identified during the current week to read their details and play a timelapse of their movement during the week.</p>
				<select id="selectSturgeon"></select>		
				<div id="card-content"></div>
			</card-content>

		</content>

		<script type="text/javascript" src="sturgeon.js"></script>

    </body>
</html>
