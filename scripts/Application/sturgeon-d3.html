<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>D3 interactive sturgeon map</title>
		<script type="text/javascript" src="../../d3.js"></script>
		<link rel="stylesheet" type="text/css" href="style.css" />
	</head>
	
	<body>

		<div class="container">
			<div class="sidebar">
			</div>

			<main class="content">
				<div id="map-container">
					<div id="tooltip"></div>
					<div class="text-buttons">
						<div class="text-button prev" data-idx="-1">Back</div>
						<div class="text-button next" data-idx="1">Next</div>
					</div>
				</div>
			</main>
		</div>
		
		<script type="text/javascript" src="app.js"></script>

	</body>
</html>
