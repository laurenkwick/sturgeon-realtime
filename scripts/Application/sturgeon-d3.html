<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>D3 interactive sturgeon map</title>
		<script type="text/javascript" src="../../d3.js"></script>
		<script type="text/javascript" src="../../lodash.js"></script>
		<style>
			/*Optional: Centers the map on the page*/
			body { font-family: sans-serif; }
			#map-container { 
				width: 100%;
				max-width: 1280px;
				margin: 0 auto;
				line-height: 0;
			}
			#tooltip {
				position: absolute;
				padding: 8px;
				background: white;
				border: 1px solid #ccc;
				pointer-events: none; /* Crucial: clicks pass through to circles */
				opacity: 0;
				font-size: 12px;
				box-shadow: 2px 2px 6px rgba(0,0,0,0.1);
			}
			circle:hover { fill: orange; cursor: pointer; }
			.container {
				display: flex;
				width: 100%;
			}
			.sidebar {
				position: sticky;
				top: 0;
				height: 100vh;
				width: 300px;
				min-width: 200px; /* Prevents sidebar from shrinking when window size changes */
				background-color: #f8f8f8;
				border-right: 1px solid #ddd;
				z-index: 10;
			}

			.sidebar-details {
				padding: 20px;
				font-family: "candara", sans-serif;
				font-weight: 400;
			}

			.content {
				flex: 1;
				overflow-x: auto; /* Adds a scrollbar only to the map area if it's too wide */
				display: flex;
				justify-content: center;
				align-items: center;
			}
			text {
				font-family: candara, sans-serif;
				font-size: 52px;
				font-weight: 400;
				fill: #3288BD;
			}
		</style>
	</head>
	<body>

		<div class="container">
			<div class="sidebar">
			</div>

			<main class="content">
				<div id="map-container"></div>
				<div id="tooltip"></div>
			</main>
		</div>
				<script type="text/javascript" src="sturgeon.js"></script>
	</body>
</html>
